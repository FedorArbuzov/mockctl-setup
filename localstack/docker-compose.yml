services:
  localstack:
    # Pin 3.8: localstack/localstack:latest (2026.3+) requires LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,lambda,dynamodb,iam,sqs,sns,sts,logs,apigateway,events,secretsmanager,kms,ec2,elbv2,rds,ecs,cloudwatch
      - DEBUG=0
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  localstack-data:
